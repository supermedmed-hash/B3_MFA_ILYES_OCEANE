version: '3.8'

services:
  # === LAYER APPLICATIF ===
  smartoffice-web:
    image: ${ACR_LOGIN_SERVER}/smartoffice-web:latest
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - WEBSITES_PORT=3000
      - POSTGRES_HOST=db-postgres
      - POSTGRES_USER=admin_postgres
      - POSTGRES_PASSWORD=secret_postgres
      - POSTGRES_DB=smartoffice
      - MONGO_URI=mongodb://db-mongo:27017/smartoffice_iot
    depends_on:
      - db-postgres
      - db-mongo

  # === LAYER DATA : PostgreSQL ===
  db-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=admin_postgres
      - POSTGRES_PASSWORD=secret_postgres
      - POSTGRES_DB=smartoffice
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === LAYER DATA : MongoDB ===
  db-mongo:
    image: mongo:6
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === MONITORING : Zabbix (MariaDB + Server + Web) ===
  zabbix-db:
    image: mariadb:11.3
    environment:
      - MARIADB_USER=zabbix
      - MARIADB_PASSWORD=zabbix_pass
      - MARIADB_ROOT_PASSWORD=root_pass
      - MARIADB_DATABASE=zabbix
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin --log-bin-trust-function-creators=1

  zabbix-server:
    image: zabbix/zabbix-server-mysql:ubuntu-latest
    depends_on:
      - zabbix-db
    environment:
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=zabbix_pass
      - MYSQL_DATABASE=zabbix
      - MYSQL_ROOT_PASSWORD=root_pass

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:ubuntu-latest
    depends_on:
      - zabbix-db
      - zabbix-server
    environment:
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=zabbix_pass
      - MYSQL_DATABASE=zabbix
      - MYSQL_ROOT_PASSWORD=root_pass
      - ZBX_SERVER_HOST=zabbix-server
      - PHP_TZ=Europe/Paris
    ports:
      - "8080:8080"

  # === VISUALISATION : Grafana ===
  grafana:
    image: grafana/grafana-oss:latest
    depends_on:
      - zabbix-server
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app
    ports:
      - "3001:3000"
