# GitHub Actions Workflow - Docker Build & Push
# Responsable: Mehdi (Lead DevOps)

name: Docker Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app-reservation/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'app-reservation/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        cd app-reservation
        docker build -t smart-office-app:${{ github.sha }} .
    
