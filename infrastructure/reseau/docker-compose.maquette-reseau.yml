version: '3.8'

services:
  # =========================================================
  # 🛡️ ROUTEUR / PARE-FEU (Simule pfSense)
  # =========================================================
  pfsense_mock:
    image: alpine:latest
    container_name: maquette_pfsense
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    command: >
      sh -c "
        apk add --no-cache iptables &&
        # Politique par défaut : TOUT BLOQUER
        iptables -P FORWARD DROP &&
        # Règle 1 : Autoriser VLAN 20 (Employés) vers VLAN 10 (Serveurs)
        iptables -A FORWARD -s 10.10.20.0/24 -d 10.10.10.0/24 -j ACCEPT &&
        # Règle 2 : Autoriser VLAN 30 (R&D) vers VLAN 10 (Serveurs) UNIQUEMENT
        iptables -A FORWARD -s 10.10.30.0/24 -d 10.10.10.0/24 -j ACCEPT &&
        # Autoriser les paquets de retour (Stateful)
        iptables -A FORWARD -m state --state ESTABLISHED,RELATED -j ACCEPT &&
        echo 'Pare-feu actif' &&
        tail -f /dev/null
      "
    networks:
      vlan10:
        ipv4_address: 10.10.10.254
      vlan20:
        ipv4_address: 10.10.20.254
      vlan30:
        ipv4_address: 10.10.30.254

  # =========================================================
  # 🖥️ SERVEUR AD (VLAN 10)
  # =========================================================
  srv_ad:
    image: alpine:latest
    container_name: maquette_srv_ad
    cap_add:
      - NET_ADMIN
    command: sh -c "ip route add 10.10.0.0/16 via 10.10.10.254 && tail -f /dev/null"
    networks:
      vlan10:
        ipv4_address: 10.10.10.10

  # =========================================================
  # 💻 POSTE EMPLOYÉ (VLAN 20)
  # =========================================================
  pc_employe:
    image: alpine:latest
    container_name: maquette_pc_employe
    cap_add:
      - NET_ADMIN
    command: sh -c "ip route add 10.10.0.0/16 via 10.10.20.254 && tail -f /dev/null"
    networks:
      vlan20:
        ipv4_address: 10.10.20.50

  # =========================================================
  # 🧪 POSTE R&D (VLAN 30)
  # =========================================================
  pc_rd:
    image: alpine:latest
    container_name: maquette_pc_rd
    cap_add:
      - NET_ADMIN
    command: sh -c "ip route add 10.10.0.0/16 via 10.10.30.254 && tail -f /dev/null"
    networks:
      vlan30:
        ipv4_address: 10.10.30.50

# =========================================================
# 🖧 DÉFINITION DES SOUS-RÉSEAUX (VLANs)
# =========================================================
networks:
  vlan10:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
  vlan20:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.20.0/24
  vlan30:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.30.0/24
