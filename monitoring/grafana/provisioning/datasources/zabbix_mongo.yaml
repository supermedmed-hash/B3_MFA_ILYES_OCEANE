apiVersion: 1

datasources:
  - name: Zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-web:8080/api_jsonrpc.php
    jsonData:
      username: Admin
      password: zabbix
      trends: false
      cacheTTL: 60s
    secureJsonData:
      password: zabbix
    editable: true

  - name: MongoDB
    type: grafana-mongodb-datasource
    access: proxy
    url: mongodb://db-mongo:27017
    jsonData:
      database: smartoffice_iot
    editable: true
